<script>
(function(){
  const toggle = document.getElementById('navToggle');
  const links = document.querySelector('.nav__links');
  if(toggle){
    toggle.addEventListener('click', ()=>{
      const open = links.style.display === 'flex';
      links.style.display = open ? 'none' : 'flex';
      links.style.flexDirection = 'column';
      links.style.position = 'absolute';
      links.style.top = '60px';
      links.style.right = '32px';
      links.style.background = 'rgba(15,18,32,0.92)';
      links.style.backdropFilter = 'blur(14px)';
      links.style.border = '1px solid var(--line)';
      links.style.borderRadius = '10px';
      links.style.padding = '16px 22px';
      links.style.gap = '14px';
    });
  }

  const roles = ['Agentic AI Engineer','Generative AI Developer','RAG Systems Engineer','LLM Application Developer'];
  const el = document.getElementById('roleTyper');
  let ri = 0, ci = 0, deleting = false;
  function tick(){
    const word = roles[ri];
    if(!deleting){
      ci++; el.textContent = word.slice(0,ci);
      if(ci === word.length){ deleting = true; setTimeout(tick, 1400); return; }
    } else {
      ci--; el.textContent = word.slice(0,ci);
      if(ci === 0){ deleting = false; ri = (ri+1) % roles.length; }
    }
    setTimeout(tick, deleting ? 35 : 65);
  }
  tick();

  const revealIo = new IntersectionObserver((items)=>{
    items.forEach(item=>{ if(item.isIntersecting) item.target.classList.add('is-visible'); });
  }, {threshold:0.15});
  document.querySelectorAll('.reveal').forEach(e=>revealIo.observe(e));

  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, nodes;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const count = Math.max(28, Math.min(70, Math.round((W*H)/26000)));
    nodes = Array.from({length:count}, ()=>({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.25, vy: (Math.random()-0.5)*0.25,
      r: Math.random()*1.6 + 0.8, hub: Math.random() < 0.12
    }));
  }
  window.addEventListener('resize', resize);
  resize();
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(142,124,255,0.045)'; ctx.lineWidth = 1;
    const gap = 64;
    for(let x=0; x<W; x+=gap){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0; y<H; y+=gap){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j];
        const dx = a.x-b.x, dy = a.y-b.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 150){
          const alpha = (1 - dist/150) * 0.16;
          ctx.strokeStyle = `rgba(84,220,235,${alpha})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        }
      }
    }
    nodes.forEach(n=>{
      if(!reduceMotion){
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > W) n.vx *= -1;
        if(n.y < 0 || n.y > H) n.vy *= -1;
      }
      ctx.beginPath();
      ctx.fillStyle = n.hub ? 'rgba(142,124,255,0.85)' : 'rgba(142,124,255,0.45)';
      ctx.arc(n.x, n.y, n.hub ? n.r*2.2 : n.r, 0, Math.PI*2);
      ctx.fill();
      if(n.hub){
        ctx.beginPath(); ctx.strokeStyle = 'rgba(84,220,235,0.35)'; ctx.lineWidth = 1;
        ctx.arc(n.x, n.y, n.r*4.5, 0, Math.PI*2); ctx.stroke();
      }
    });
    if(!reduceMotion) requestAnimationFrame(draw);
  }
  draw();

  const glyphTexts = ['conf: 0.94','agent: active','latency: 42ms','ROI: +41%','ctx: 8k','HITL: pass','eval: pass','token: 512','automation: 84%'];
  const glyphLayer = document.getElementById('bgGlyphs');
  glyphTexts.forEach((text, i)=>{
    const elx = document.createElement('span');
    elx.textContent = text;
    if(i % 2 === 0) elx.classList.add('violet');
    elx.style.left = (Math.random()*90 + 3) + 'vw';
    elx.style.top = (Math.random()*90 + 3) + 'vh';
    elx.style.animationDuration = (10 + Math.random()*8) + 's';
    elx.style.animationDelay = (Math.random()*-10) + 's';
    glyphLayer.appendChild(elx);
  });
})();
</script>

