<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anish Kumar M — Agentic AI Engineer</title>
<meta name="description" content="Anish Kumar M — Agentic AI Engineer at HCL Tech. Multi-agent systems, RAG pipelines, and LLM application development for enterprise MarTech platforms." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A16;
  --bg-panel:rgba(20,25,42,.62);
  --line:#2A3150;
  --line-soft:#1B2038;
  --ink:#EDEFF7;
  --ink-muted:#98A0C2;
  --ink-faint:#5C6389;
  --accent:#8E7CFF;
  --accent-dim:#3A3380;
  --cyan:#54DCEB;
  --font-display:'Sora',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono',monospace;
  --maxw:1180px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  background:radial-gradient(ellipse 120% 80% at 50% -10%, #101A3D 0%, #070A16 55%, #050710 100%);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
ul,ol{list-style:none;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 32px;}
#bgCanvas{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
.bg-glyphs{position:fixed; inset:0; z-index:1; overflow:hidden; pointer-events:none;}
.bg-glyphs span{position:absolute; font-family:var(--font-mono); font-size:13px; color:var(--cyan); opacity:.16; white-space:nowrap; animation:drift linear infinite;}
.bg-glyphs span.violet{color:var(--accent);}
@keyframes drift{0%{transform:translateY(0) translateX(0);}50%{transform:translateY(-26px) translateX(10px);}100%{transform:translateY(0) translateX(0);}}
nav, section, footer{position:relative; z-index:2;}

.hero__panel, .about__avatar, .about__card, .skill-group, .exp-card, .stat-card, .edu-card, .contact__form input, .contact__form textarea{
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--cyan);
  display:inline-flex; align-items:center; gap:8px;
}
.eyebrow::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan);}
.section-head{max-width:620px; margin:0 0 56px;}
.section-head h2{font-family:var(--font-display); font-weight:700; font-size:clamp(28px,4vw,42px); line-height:1.12; margin:14px 0 12px; letter-spacing:-0.01em;}
.section-head h2 em{font-style:normal; color:var(--accent);}
.section-head p{color:var(--ink-muted); font-size:16px;}
.btn{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:13.5px;
  padding:12px 20px; border-radius:8px; border:1px solid var(--line); cursor:pointer; background:transparent; color:var(--ink);
  transition:border-color .2s ease, transform .2s ease, background .2s ease;
}
.btn:hover{border-color:var(--accent); transform:translateY(-1px);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#0B0D14; font-weight:600;}
.btn.primary:hover{background:#a495ff; border-color:#a495ff;}
.reveal{opacity:0; transform:translateY(20px); transition:opacity .6s ease, transform .6s ease;}
.reveal.is-visible{opacity:1; transform:translateY(0);}

/* nav */
.nav{position:fixed; top:0; left:0; right:0; z-index:50; background:rgba(7,10,22,.72); backdrop-filter:blur(10px); border-bottom:1px solid var(--line-soft);}
.nav__inner{max-width:var(--maxw); margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between;}
.nav__logo{font-family:var(--font-mono); font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px;}
.nav__logo .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
.nav__links{display:flex; gap:26px; font-family:var(--font-mono); font-size:13px; color:var(--ink-muted);}
.nav__links a{transition:color .2s ease;}
.nav__links a:hover{color:var(--ink);}
.nav__cta{display:flex; gap:12px;}
.nav__toggle{display:none; background:none; border:none; color:var(--ink); font-size:22px; cursor:pointer;}
@media (max-width:900px){ .nav__links, .nav__cta{display:none;} .nav__toggle{display:block;} }

/* hero */
.hero{padding:168px 0 100px; border-bottom:1px solid var(--line-soft); overflow:hidden;}
.hero__grid{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; align-items:center;}
.hero__kicker{font-family:var(--font-mono); font-size:13px; color:var(--ink-muted); margin-bottom:18px;}
.hero__kicker .cursor{display:inline-block; width:8px; height:16px; background:var(--cyan); margin-left:4px; vertical-align:middle; animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.hero h1{font-family:var(--font-display); font-weight:800; font-size:clamp(36px,5.6vw,58px); line-height:1.06; letter-spacing:-0.02em;}
.hero h1 span{background:linear-gradient(90deg,var(--accent),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero__role{font-family:var(--font-mono); font-size:16.5px; color:var(--cyan); margin:20px 0 20px; min-height:26px;}
.hero__desc{color:var(--ink-muted); font-size:16px; max-width:540px; margin-bottom:32px;}
.hero__ctas{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:36px;}
.hero__meta{display:flex; gap:24px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); flex-wrap:wrap;}
.hero__meta span{display:flex; align-items:center; gap:6px;}
.hero__meta .d{width:5px; height:5px; border-radius:50%; background:var(--ink-faint);}

.hero__panel{background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; font-family:var(--font-mono); font-size:13px;}
.hero__panel-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); background:rgba(27,33,52,.75);}
.hero__panel-head span{width:9px; height:9px; border-radius:50%; background:var(--line);}
.hero__panel-head b{font-weight:500; color:var(--ink-faint); font-size:12px; margin-left:6px;}
.hero__panel-body{padding:20px; color:var(--ink-muted); white-space:pre-wrap;}
.hero__panel-body .k{color:var(--accent);}
.hero__panel-body .s{color:var(--cyan);}
.hero__panel-body .c{color:var(--ink-faint);}

/* hero stat strip */
.hero__stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:36px;}
.hero__stats div{background:var(--bg-panel); padding:16px 14px; text-align:center;}
.hero__stats b{display:block; font-family:var(--font-mono); font-size:20px; color:var(--accent);}
.hero__stats span{display:block; font-size:11px; color:var(--ink-muted); margin-top:4px;}
@media (max-width:760px){ .hero__grid{grid-template-columns:1fr;} .hero__stats{grid-template-columns:repeat(2,1fr);} }

/* experience */
.experience{padding:120px 0; border-bottom:1px solid var(--line-soft);}
.exp-role{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:28px 30px; margin-bottom:36px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;
}
.exp-role h3{font-family:var(--font-display); font-size:22px; font-weight:700;}
.exp-role .org{font-family:var(--font-mono); font-size:13px; color:var(--cyan); margin-top:6px;}
.exp-role .dates{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); border:1px solid var(--line); padding:6px 12px; border-radius:6px;}
.exp-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;}
.exp-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; padding:22px; transition:border-color .2s ease, transform .2s ease;}
.exp-card:hover{border-color:var(--accent-dim); transform:translateY(-2px);}
.exp-card .tag{font-family:var(--font-mono); font-size:10.5px; color:var(--accent); border:1px solid var(--accent-dim); padding:3px 8px; border-radius:4px; display:inline-block; margin-bottom:12px;}
.exp-card h4{font-family:var(--font-display); font-size:15.5px; font-weight:600; margin-bottom:8px;}
.exp-card p{font-size:13px; color:var(--ink-muted); line-height:1.55;}
@media (max-width:900px){ .exp-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:600px){ .exp-grid{grid-template-columns:1fr;} .exp-role{flex-direction:column; align-items:flex-start;} }

/* skills */
.skills{padding:120px 0; border-bottom:1px solid var(--line-soft);}
.skills__grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;}
.skill-group{background:var(--bg-panel); padding:24px 24px 20px;}
.skill-group h3{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--cyan); margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.skill-group h3::before{content:'#'; color:var(--accent);}
.skill-tags{display:flex; flex-wrap:wrap; gap:7px;}
.skill-tags span{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); border:1px solid var(--line); padding:4px 9px; border-radius:6px; transition:border-color .2s ease, color .2s ease;}
.skill-tags span:hover{border-color:var(--accent-dim); color:var(--ink);}
@media (max-width:860px){ .skills__grid{grid-template-columns:1fr;} }

/* flagship projects */
.projects{padding:120px 0; border-bottom:1px solid var(--line-soft);}
.flagship{background:var(--bg-panel); border:1px solid var(--line); border-radius:16px; padding:36px; margin-bottom:28px;}
.flagship__top{display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px; margin-bottom:18px;}
.flagship__tag{font-family:var(--font-mono); font-size:11px; color:var(--accent); border:1px solid var(--accent-dim); padding:4px 10px; border-radius:5px;}
.flagship__dates{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);}
.flagship h3{font-family:var(--font-display); font-size:24px; font-weight:700; margin-bottom:6px;}
.flagship .client{font-family:var(--font-mono); font-size:12.5px; color:var(--cyan); margin-bottom:18px;}
.flagship .challenge{color:var(--ink-muted); font-size:14.5px; line-height:1.65; margin-bottom:20px;}
.flagship .challenge b{color:var(--ink); font-weight:600;}
.flagship__stats{display:grid; grid-template-columns:repeat(5,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:22px;}
.stat-card{background:rgba(27,33,52,.75); padding:16px 10px; text-align:center;}
.stat-card b{display:block; font-family:var(--font-mono); font-size:22px; color:var(--accent);}
.stat-card span{display:block; font-size:10.5px; color:var(--ink-muted); margin-top:4px; line-height:1.3;}
.flagship__stack{display:flex; flex-wrap:wrap; gap:7px;}
.flagship__stack span{font-family:var(--font-mono); font-size:11px; color:var(--ink-muted); border:1px solid var(--line); padding:4px 9px; border-radius:6px;}
@media (max-width:760px){ .flagship__stats{grid-template-columns:repeat(2,1fr);} .flagship{padding:26px;} }

/* open source projects */
.opensource{padding:120px 0; border-bottom:1px solid var(--line-soft);}
.proj__grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
.proj-card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:26px;
  display:flex; flex-direction:column; gap:12px; color:inherit;
  transition:border-color .2s ease, transform .2s ease;
}
.proj-card:hover{border-color:var(--accent-dim); transform:translateY(-3px);}
.proj-card__top{display:flex; align-items:center; justify-content:space-between;}
.proj-card__tag{font-family:var(--font-mono); font-size:11px; color:var(--accent); border:1px solid var(--accent-dim); padding:3px 9px; border-radius:4px;}
.proj-card__date{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);}
a.proj-card:hover .proj-card__date{color:var(--cyan);}
.proj-card h3{font-family:var(--font-display); font-size:18px; font-weight:600;}
.proj-card__role{font-family:var(--font-mono); font-size:11.5px; color:var(--cyan);}
.proj-card p.desc{color:var(--ink-muted); font-size:13.5px; line-height:1.6;}
.proj-card__stack{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:10px;}
.proj-card__stack span{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-muted); border:1px solid var(--line); padding:3px 7px; border-radius:5px;}
@media (max-width:980px){ .proj__grid{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){ .proj__grid{grid-template-columns:1fr;} }

.repo-head{margin:56px 0 24px;}
.repo-head h3{font-family:var(--font-display); font-size:20px; font-weight:600; margin-bottom:6px;}
.repo-head p{color:var(--ink-muted); font-size:14px;}
.repo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.repo-card{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:18px; color:inherit; display:block;
  transition:border-color .2s ease, transform .2s ease;
}
.repo-card:hover{border-color:var(--accent-dim); transform:translateY(-2px);}
.repo-card__top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px;}
.repo-card__top h4{font-family:var(--font-display); font-size:13.5px; font-weight:600; line-height:1.3;}
.repo-card__top span{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint);}
.repo-card:hover .repo-card__top span{color:var(--cyan);}
.repo-card p{font-size:12px; color:var(--ink-muted); line-height:1.5; margin-bottom:10px;}
.repo-card__lang{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);}
.repo-card__lang i{width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block;}
@media (max-width:980px){ .repo-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:640px){ .repo-grid{grid-template-columns:1fr;} }

/* education */
.education{padding:100px 0; border-bottom:1px solid var(--line-soft);}
.edu-card{background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:30px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;}
.edu-card h3{font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:6px;}
.edu-card .org{color:var(--ink-muted); font-size:13.5px;}
.edu-card .cgpa{font-family:var(--font-mono); font-size:13px; color:var(--accent); border:1px solid var(--accent-dim); padding:8px 14px; border-radius:8px;}

/* contact */
.contact{padding:120px 0 80px;}
.contact__grid{display:grid; grid-template-columns:1fr 1fr; gap:56px;}
.contact__form{display:flex; flex-direction:column; gap:14px;}
.contact__form input, .contact__form textarea{
  background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:13px 16px; color:var(--ink);
  font-family:var(--font-body); font-size:14px; outline:none; transition:border-color .2s ease;
}
.contact__form input:focus, .contact__form textarea:focus{border-color:var(--accent);}
.contact__form textarea{resize:vertical; min-height:120px;}
.contact__info h3{font-family:var(--font-display); font-size:18px; margin-bottom:16px;}
.contact__row{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line-soft); font-size:14px; color:var(--ink-muted);}
.contact__row b{color:var(--ink); font-weight:500; font-family:var(--font-mono); font-size:12.5px; min-width:80px; display:inline-block;}
.contact__row a{color:var(--cyan);}
@media (max-width:820px){ .contact__grid{grid-template-columns:1fr;} .edu-card{flex-direction:column; align-items:flex-start;} }

/* footer */
.footer{border-top:1px solid var(--line-soft); padding:28px 0;}
.footer__inner{display:flex; align-items:center; justify-content:space-between; font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); flex-wrap:wrap; gap:10px;}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="bg-glyphs" id="bgGlyphs"></div>

<nav class="nav">
  <div class="nav__inner">
    <div class="nav__logo"><span class="dot"></span>anish.dev</div>
    <div class="nav__links">
      <a href="#home">home</a>
      <a href="#about">about</a>
      <a href="#experience">experience</a>
      <a href="#skills">skills</a>
      <a href="#projects">projects</a>
      <a href="#opensource">open source</a>
      <a href="#education">education</a>
      <a href="#contact">contact</a>
    </div>
    <div class="nav__cta">
      <a href="https://github.com/buildbyanish" target="_blank" rel="noopener" class="btn">github</a>
      <a href="#contact" class="btn primary">let's talk</a>
    </div>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
  </div>
</nav>

<section id="home" class="hero" data-section="home">
  <div class="wrap hero__grid">
    <div>
      <div class="hero__kicker">&gt; whoami<span class="cursor"></span></div>
      <h1>Anish Kumar M<br/><span>ships agents</span><br/>to production.</h1>
      <div class="hero__role" id="roleTyper"></div>
      <p class="hero__desc">Agentic AI Engineer with 2+ years building multi-agent systems, RAG pipelines, and LLM-powered enterprise applications — currently at HCL Tech, automating digital marketing and MarTech workflows with CrewAI, LangGraph, and LangChain.</p>
      <div class="hero__ctas">
        <a href="#projects" class="btn primary">View flagship projects →</a>
        <a href="#contact" class="btn">Get in touch</a>
      </div>
      <div class="hero__meta">
        <span><i class="d"></i>Chennai, India</span>
        <span><i class="d"></i>HCL Tech — Delhi, India</span>
        <span><i class="d"></i>2+ years experience</span>
      </div>
      <div class="hero__stats reveal">
        <div><b>74%</b><span>Faster campaign planning</span></div>
        <div><b>84%</b><span>Marketing ops automated</span></div>
        <div><b>2</b><span>Flagship platforms shipped</span></div>
        <div><b>2+</b><span>Years in production AI</span></div>
      </div>
    </div>
    <div class="hero__panel">
      <div class="hero__panel-head"><span></span><span></span><span></span><b>agent_profile.py</b></div>
      <div class="hero__panel-body"><span class="c"># current role</span>
<span class="k">engineer</span> = Agent(
  name=<span class="s">"Anish Kumar M"</span>,
  title=<span class="s">"Agentic AI Engineer"</span>,
  company=<span class="s">"HCL Tech"</span>,
  since=<span class="s">"June 2024"</span>,
  stack=[<span class="s">"CrewAI"</span>, <span class="s">"LangGraph"</span>,
         <span class="s">"LangChain"</span>, <span class="s">"FastAPI"</span>],
  domain=<span class="s">"MarTech / Digital Marketing"</span>
)

<span class="k">engineer</span>.status = <span class="s">"in production"</span>
<span class="c"># >>> deployed</span></div>
    </div>
  </div>
</section>

<section id="about" class="about" data-section="about" style="padding:120px 0; border-bottom:1px solid var(--line-soft);">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow">about</span>
      <h2>Two years of<br/><em>production</em> agents.</h2>
    </div>
    <div style="display:grid; grid-template-columns:.85fr 1.15fr; gap:56px; align-items:start;" class="about__grid">
      <div class="reveal">
        <div class="about__avatar" style="width:100%; aspect-ratio:1; max-width:320px; border-radius:16px; background:var(--bg-panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden;">
          <img src="data:image/jpeg;base64," alt="Anish Kumar M" style="width:100%; height:100%; object-fit:cover;" />
        </div>
        <div style="margin-top:18px; font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:8px;">
          <span style="width:6px; height:6px; border-radius:50%; background:var(--cyan); box-shadow:0 0 6px var(--cyan);"></span>currently employed · HCL Tech
        </div>
      </div>
      <div>
        <div class="reveal" style="color:var(--ink-muted); font-size:15.5px;">
          <p style="margin-bottom:16px;">I'm a results-driven Agentic AI Engineer with 2+ years of experience designing, developing, and deploying intelligent AI-powered enterprise applications. At HCL Tech, I build multi-agent systems using CrewAI, LangGraph, and LangChain to automate digital marketing and MarTech workflows — campaign planning, SEO content generation, lead qualification, and marketing analytics.</p>
          <p style="margin-bottom:16px;">My work spans the full agentic stack: RAG pipelines over enterprise knowledge bases, FastAPI microservices exposing AI capabilities, structured prompt engineering, agent memory management, and Human-in-the-Loop workflows for production-grade reliability. I evaluate everything I ship using RAGAS and custom evaluation frameworks before it reaches production.</p>
